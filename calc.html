<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ポケモンポーカー</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;color:#0B0F4F;display:grid;place-items:center;padding:16px;
  background:repeating-conic-gradient(from -4deg at 50% 30%,rgba(255,255,255,.07) 0 5deg,transparent 5deg 13deg),radial-gradient(ellipse 90% 70% at 50% 30%,#5A3BE8 0%,#2A23A8 38%,#121673 70%,#0A0D45 100%)}
.box{width:min(380px,100%);background:#fff;border:3px solid #0B0F4F;border-radius:22px;box-shadow:0 6px 0 #0B0F4F;padding:24px 20px;display:grid;gap:14px;text-align:center}
h1{font-size:22px;font-weight:900}
p{font-size:14px;font-weight:700;color:#3B4170}
input[type=password]{font:inherit;font-size:18px;font-weight:700;padding:12px 14px;border:3px solid #0B0F4F;border-radius:14px;width:100%;text-align:center;background:#F4F6FF;color:#0B0F4F}
button{font:inherit;font-size:17px;font-weight:900;border:3px solid #0B0F4F;border-radius:999px;padding:12px;background:#FFD400;color:#0B0F4F;box-shadow:0 5px 0 #0B0F4F;cursor:pointer}
button:disabled{opacity:.5}
label{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.err{color:#E8303A;font-weight:900;min-height:1.4em}
.hide{display:none}
</style>
</head>
<body>
<form class="box hide" id="f" autocomplete="off">
  <h1>合言葉を入れてね</h1>
  <p>このゲームは合言葉を知っている人だけが遊べます。</p>
  <input type="password" id="pw" aria-label="合言葉" autocomplete="current-password">
  <label><input type="checkbox" id="rem" checked>この端末では、次から入れなくてOK</label>
  <button id="go">ひらく</button>
  <p class="err" id="err" aria-live="polite"></p>
</form>

function show(html){ document.open(); document.write(html); document.close(); }
(async () => {
  const f = document.getElementById('f');
  if (!window.crypto || !crypto.subtle){ f.classList.remove('hide'); document.getElementById('err').textContent = 'このブラウザでは開けません（https のページで開いてください）'; return; }
  const saved = get('pkp-key');
  if (saved){ const h = await open_(u8(saved)); if (h) return show(h); }
  f.classList.remove('hide'); document.getElementById('pw').focus();
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const go = document.getElementById('go'), er = document.getElementById('err');
    go.disabled = true; er.textContent = ''; go.textContent = 'たしかめ中…';
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveBits']);
    const raw = new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', salt:u8(S), iterations:IT, hash:'SHA-256'}, base, 256));
    const h = await open_(raw);
    if (!h){ er.textContent = '合言葉がちがいます'; go.disabled = false; go.textContent = 'ひらく'; return; }
    put('pkp-key', enc(raw), document.getElementById('rem').checked);
    show(h);
  });
})();
</script>
</body>
</html>
